[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-contracts"
version = "0.1.0"
description = "Offline annotation exchange contracts, A-side v1 proposal"
requires-python = ">=3.9"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
annotation-contracts = "annotation.contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
